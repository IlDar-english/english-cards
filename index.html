,"tr": "/laɪt/","t": "w"},{"en": "Voice","ru": "Голос","tr": "/vɔɪs/","t": "w"},{"en": "Street","ru": "Улица","tr": "/striːt/","t": "w"},{"en": "Bread","ru": "Хлеб","tr": "/bred/","t": "w"},{"en": "Snow","ru": "Снег","tr": "/snoʊ/","t": "w"},{"en": "Rain","ru": "Дождь","tr": "/reɪn/","t": "w"},{"en": "Sea","ru": "Море","tr": "/siː/","t": "w"},{"en": "Bird","ru": "Птица","tr": "/bɝːd/","t": "w"},{"en": "Cat","ru": "Кот","tr": "/kæt/","t": "w"},{"en": "Smile","ru": "Улыбка","tr": "/smaɪl/","t": "w"},{"en": "Star","ru": "Звезда","tr": "/stɑːr/","t": "w"},{"en": "Road","ru": "Дорога","tr": "/roʊd/","t": "w"},{"en": "Garden","ru": "Сад","tr": "/ˈɡɑːr.dən/","t": "w"},{"en": "Market","ru": "Рынок","tr": "/ˈmɑːr.kɪt/","t": "w"},{"en": "Lesson","ru": "Урок","tr": "/ˈles.ən/","t": "w"},{"en": "Answer","ru": "Ответ","tr": "/ˈæn.sɚ/","t": "w"},{"en": "make a decision","ru": "Принять решение","tr": "/meɪk ə dɪˈsɪʒ.ən/","t": "p"},{"en": "keep in mind","ru": "Помнить, учитывать","tr": "/kiːp ɪn maɪnd/","t": "p"},{"en": "a piece of cake","ru": "Проще простого","tr": "/ə piːs əv keɪk/","t": "p"},{"en": "give up","ru": "Сдаваться","tr": "/ɡɪv ʌp/","t": "p"},{"en": "look after","ru": "Присматривать за","tr": "/lʊk ˈæf.tɚ/","t": "p"},{"en": "get better","ru": "Становиться лучше","tr": "/ɡet ˈbet.ɚ/","t": "p"},{"en": "on time","ru": "Вовремя","tr": "/ɑːn taɪm/","t": "p"},{"en": "take care","ru": "Береги себя","tr": "/teɪk ker/","t": "p"},{"en": "of course","ru": "Конечно","tr": "/əv kɔːrs/","t": "p"},{"en": "by the way","ru": "Кстати","tr": "/baɪ ðə weɪ/","t": "p"},{"en": "as soon as possible","ru": "Как можно скорее","tr": "/æz suːn æz ˈpɑː.sə.bəl/","t": "p"},{"en": "come up with","ru": "Придумать","tr": "/kʌm ʌp wɪð/","t": "p"},{"en": "run out of","ru": "Закончиться (о запасе)","tr": "/rʌn aʊt əv/","t": "p"},{"en": "get along with","ru": "Ладить с кем-то","tr": "/ɡet əˈlɔːŋ wɪð/","t": "p"},{"en": "pay attention","ru": "Обращать внимание","tr": "/peɪ əˈten.ʃən/","t": "p"},{"en": "feel like","ru": "Хотеть, быть в настроении","tr": "/fiːl laɪk/","t": "p"},{"en": "in the end","ru": "В конце концов","tr": "/ɪn ði end/","t": "p"},{"en": "at least","ru": "По крайней мере","tr": "/æt liːst/","t": "p"},{"en": "look forward to","ru": "С нетерпением ждать","tr": "/lʊk ˈfɔːr.wɚd tuː/","t": "p"},{"en": "break the rules","ru": "Нарушать правила","tr": "/breɪk ðə ruːlz/","t": "p"},{"en": "Practice makes perfect.","ru": "Практика ведёт к совершенству.","tr": "/ˈpræk.tɪs meɪks ˈpɝː.fɪkt/","t": "s"},{"en": "Every cloud has a silver lining.","ru": "Нет худа без добра.","tr": "/ˈev.ri klaʊd hæz ə ˈsɪl.vɚ ˈlaɪ.nɪŋ/","t": "s"},{"en": "Time is money.","ru": "Время — деньги.","tr": "/taɪm ɪz ˈmʌn.i/","t": "s"},{"en": "Actions speak louder than words.","ru": "Дела важнее слов.","tr": "/ˈæk.ʃənz spiːk ˈlaʊ.dɚ ðən wɝːdz/","t": "s"},{"en": "Better late than never.","ru": "Лучше поздно, чем никогда.","tr": "/ˈbet.ɚ leɪt ðən ˈnev.ɚ/","t": "s"},{"en": "Knowledge is power.","ru": "Знание — сила.","tr": "/ˈnɑː.lɪdʒ ɪz ˈpaʊ.ɚ/","t": "s"},{"en": "The early bird catches the worm.","ru": "Кто рано встаёт, тому Бог подаёт.","tr": "/ði ˈɝː.li bɝːd ˈkætʃ.ɪz ðə wɝːm/","t": "s"},{"en": "Where is the nearest bus stop?","ru": "Где ближайшая остановка автобуса?","tr": "/wer ɪz ðə ˈnɪr.ɪst bʌs stɑːp/","t": "s"},{"en": "How much does it cost?","ru": "Сколько это стоит?","tr": "/haʊ mʌtʃ dʌz ɪt kɔːst/","t": "s"},{"en": "Could you repeat that, please?","ru": "Повторите, пожалуйста.","tr": "/kʊd juː rɪˈpiːt ðæt pliːz/","t": "s"},{"en": "I would like to book a room.","ru": "Я хотел бы забронировать номер.","tr": "/aɪ wʊd laɪk tuː bʊk ə ruːm/","t": "s"},{"en": "What time does the train leave?","ru": "Во сколько отходит поезд?","tr": "/wʌt taɪm dʌz ðə treɪn liːv/","t": "s"},{"en": "Nice to meet you.","ru": "Приятно познакомиться.","tr": "/naɪs tuː miːt juː/","t": "s"},{"en": "See you tomorrow!","ru": "До завтра!","tr": "/siː juː təˈmɑː.roʊ/","t": "s"}];

// ---------- Загрузка и миграция ----------
let words;
try {
    const saved = localStorage.getItem("englishWords");
    const savedV = parseInt(localStorage.getItem("dictVersion") || "0", 10);
    if (saved) {
        words = JSON.parse(saved);
        if (!Array.isArray(words)) throw new Error("bad data");
        if (savedV !== DICT_VERSION) {
            defaultWords.forEach(d => {
                const exists = words.some(w =>
                    (w.en || "").toLowerCase() === d.en.toLowerCase());
                if (!exists) words.push(Object.assign({}, d, {status: "new"}));
            });
            localStorage.setItem("dictVersion", String(DICT_VERSION));
        }
    } else {
        words = defaultWords.map(w => Object.assign({}, w, {status: "new"}));
        localStorage.setItem("dictVersion", String(DICT_VERSION));
    }
} catch (e) {
    words = defaultWords.map(w => Object.assign({}, w, {status: "new"}));
}

// ---------- SRS-константы ----------
const LEARNING_STEPS = [1, 10];   // минуты
const GRADUATING_INTERVAL = 1;    // дни
const EASY_INTERVAL = 4;          // дни
const MIN_EASE = 1.3;
const MAX_EASE = 3.0;
const DAY_MS = 86400000;
const MIN_MS = 60000;
// «Выучено» = карточка вышла из шагов обучения (интервал ≥ 1 дня)
const LEARNED_THRESHOLD_DAYS = 1;

// Миграция карточек: добавляем SRS-поля
words = words.map(w => {
    if (w.due === undefined) {
        if (w.status === "learned") {
            w.due = Date.now() + 4 * DAY_MS;
            w.interval = 4;
        } else if (w.status === "review") {
            w.due = Date.now();
            w.interval = 0;
        } else {
            w.due = null;
            w.interval = 0;
        }
        w.ease = 2.5;
        w.reps = 0;
        w.lapses = 0;
        w.stepIndex = 0;
    }
    return w;
});

let currentCard = null;
let accent = "en-US";

// ---------- Сохранение ----------
function save() {
    try {
        localStorage.setItem("englishWords", JSON.stringify(words));
    } catch (e) {
        console.warn("Не удалось сохранить данные:", e);
    }
}

function typeIcon(t) { return t === "p" ? "💬 Фраза" : t === "s" ? "📖 Предложение" : "🔤 Слово"; }

// «Выучена» ли карточка (для статистики и значка в списке)
function isLearned(w) {
    return (w.interval || 0) >= LEARNED_THRESHOLD_DAYS || w.status === "learned";
}

// ---------- Озвучка ----------
function speechAvailable() { return "speechSynthesis" in window; }
function speechNote(text) { document.getElementById("speechMsg").textContent = text; }

let voiceCache = [];
function loadVoices() {
    voiceCache = speechSynthesis.getVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = function() { voiceCache = speechSynthesis.getVoices(); };
    }
}

const UK_VOICE_NAMES = /daniel|kate|serena|oliver|arthur|moira|tessa|fiona|george|google uk english/i;
const US_VOICE_NAMES = /samantha|alex|karen|fred|aaron|nicky|google us english/i;

function pickEnglishVoice(lang) {
    if (!voiceCache.length) loadVoices();
    const en = voiceCache.filter(v => /^en[-_]/i.test(v.lang || ""));
    if (!en.length) return null;
    const norm = v => String(v.lang || "").replace("_", "-").toLowerCase();
    const target = String(lang).toLowerCase();
    const exact = en.filter(v => norm(v) === target);
    const pool = exact.length ? exact : en;
    const names = target === "en-gb" ? UK_VOICE_NAMES : US_VOICE_NAMES;
    return pool.find(v => names.test(v.name) && v.localService)
        || pool.find(v => names.test(v.name))
        || pool.find(v => v.localService)
        || pool[0];
}

function speakText(text, rate) {
    if (!currentCard) return;
    if (!speechAvailable()) {
        speechNote("Озвучивание недоступно в этом браузере 😕");
        return;
    }
    speechNote("");
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const v = pickEnglishVoice(accent);
    if (v) utterance.voice = v;
    utterance.lang = v ? (v.lang || accent) : accent;
    utterance.rate = rate;
    utterance.pitch = 1;
    if (accent === "en-GB" && v && !/^en[-_]gb/i.test(v.lang || "")) {
        speechNote("Британский голос не найден — используется другой английский голос.");
    }
    setTimeout(() => speechSynthesis.speak(utterance), 150);
}

loadVoices();

function speak()     { if (currentCard) speakText(currentCard.en, 1.0); }
function speakSlow() { if (currentCard) speakText(currentCard.en, 0.4); }

function setAccent(lang) {
    accent = lang;
    document.getElementById("accentUS").classList.toggle("active", lang === "en-US");
    document.getElementById("accentUK").classList.toggle("active", lang === "en-GB");
}

// ---------- SRS-логика ----------
function formatInterval(ms) {
    ms = Math.abs(ms);
    if (ms < MIN_MS) return "<1 мин";
    if (ms < 60 * MIN_MS) return Math.round(ms / MIN_MS) + " мин";
    if (ms < DAY_MS) return Math.round(ms / (60 * MIN_MS)) + " ч";
    const days = Math.round(ms / DAY_MS);
    if (days < 30) return days + " дн";
    if (days < 365) return Math.round(days / 30) + " мес";
    return (days / 365).toFixed(1) + " г";
}

function reviewSRS(card, rating) {
    const now = Date.now();
    const isLearning = (card.interval || 0) === 0;

    if (isLearning) {
        const step = card.stepIndex || 0;
        if (rating === 1) { // Again
            card.stepIndex = 0;
            card.due = now + LEARNING_STEPS[0] * MIN_MS;
            card.ease = Math.max(MIN_EASE, (card.ease || 2.5) - 0.2);
        } else if (rating === 2) { // Hard
            const idx = Math.min(step, LEARNING_STEPS.length - 1);
            card.due = now + LEARNING_STEPS[idx] * MIN_MS * 2;
        } else if (rating === 3) { // Good
            const newStep = step + 1;
            if (newStep >= LEARNING_STEPS.length) {
                card.interval = GRADUATING_INTERVAL;
                card.stepIndex = 0;
                card.due = now + GRADUATING_INTERVAL * DAY_MS;
            } else {
                card.stepIndex = newStep;
                card.due = now + LEARNING_STEPS[newStep] * MIN_MS;
            }
        } else { // Easy
            card.interval = EASY_INTERVAL;
            card.stepIndex = 0;
            card.due = now + EASY_INTERVAL * DAY_MS;
            card.ease = Math.min(MAX_EASE, (card.ease || 2.5) + 0.15);
        }
        card.reps = (card.reps || 0) + 1;
    } else {
        if (rating === 1) { // Again (lapse)
            card.lapses = (card.lapses || 0) + 1;
            card.ease = Math.max(MIN_EASE, card.ease - 0.2);
            card.interval = 0;
            card.stepIndex = 0;
            card.due = now + 10 * MIN_MS;
        } else if (rating === 2) { // Hard
            card.ease = Math.max(MIN_EASE, card.ease - 0.15);
            card.interval = Math.max(card.interval + 1, Math.round(card.interval * 1.2));
            card.due = now + card.interval * DAY_MS;
        } else if (rating === 3) { // Good
            card.interval = Math.max(card.interval + 1, Math.round(card.interval * card.ease));
            card.due = now + card.interval * DAY_MS;
        } else { // Easy
            card.ease = Math.min(MAX_EASE, card.ease + 0.15);
            card.interval = Math.max(card.interval + 1, Math.round(card.interval * card.ease * 1.3));
            card.due = now + card.interval * DAY_MS;
        }
        card.reps = (card.reps || 0) + 1;
    }
}

function previewInterval(card, rating) {
    const c = {
        due: card.due,
        interval: card.interval || 0,
        ease: card.ease || 2.5,
        reps: card.reps || 0,
        lapses: card.lapses || 0,
        stepIndex: card.stepIndex || 0
    };
    reviewSRS(c, rating);
    return c.due - Date.now();
}

function getDueCards() {
    const now = Date.now();
    return words.filter(w => w.due === null || w.due <= now);
}

function pickNextCard() {
    const due = getDueCards();
    if (!due.length) { currentCard = null; return; }
    due.sort((a, b) => {
        if (a.due === null && b.due === null) return 0;
        if (a.due === null) return -1;
        if (b.due === null) return 1;
        return a.due - b.due;
    });
    currentCard = due[0];
}

function getNextDueTime() {
    const now = Date.now();
    let minDue = Infinity;
    words.forEach(w => {
        if (w.due !== null && w.due > now && w.due < minDue) minDue = w.due;
    });
    return minDue;
}

function applyRating(rating) {
    if (!currentCard) return;
    reviewSRS(currentCard, rating);
    save();
    showCard();
}

// ---------- Отрисовка карточки ----------
function renderSRSButtons(w) {
    const cont = document.getElementById("srsButtons");
    cont.innerHTML = "";
    const labels = [
        { rating: 1, cls: "srs-again", name: "Снова", icon: "🔴" },
        { rating: 2, cls: "srs-hard",  name: "Трудно", icon: "🟠" },
        { rating: 3, cls: "srs-good",  name: "Хорошо", icon: "🟢" },
        { rating: 4, cls: "srs-easy",  name: "Легко",  icon: "🔵" }
    ];
    labels.forEach(L => {
        const btn = document.createElement("button");
        btn.className = L.cls;
        const preview = previewInterval(w, L.rating);
        btn.innerHTML = L.icon + " " + L.name + "<small>" + formatInterval(preview) + "</small>";
        btn.onclick = function() { applyRating(L.rating); };
        cont.appendChild(btn);
    });
}

function showCard() {
    pickNextCard();
    const wordEl = document.getElementById("word");
    const infoEl = document.getElementById("srsInfo");
    const transEl = document.getElementById("transcription");
    const transBlock = document.getElementById("translation");
    const badgeEl = document.getElementById("typeBadge");
    const btnCont = document.getElementById("srsButtons");

    if (!currentCard) {
        wordEl.textContent = "🎉 Всё повторено!";
        wordEl.classList.remove("long");
        wordEl.classList.add("done-card");
        transEl.textContent = "";
        transEl.classList.add("hidden");
        transBlock.classList.add("hidden");
        badgeEl.textContent = "Готово";
        const nextDue = getNextDueTime();
        if (nextDue < Infinity) {
            infoEl.textContent = "Следующее повторение через " + formatInterval(nextDue - Date.now());
            infoEl.className = "srs-info";
        } else {
            infoEl.textContent = "Добавь новые слова, чтобы продолжить!";
            infoEl.className = "srs-info";
        }
        btnCont.innerHTML = "";
        updateStats();
        return;
    }

    wordEl.classList.remove("done-card");
    const w = currentCard;
    wordEl.textContent = w.en;
    wordEl.classList.toggle("long", w.en.length > 22);
    transEl.textContent = w.tr || "";
    transEl.classList.toggle("hidden", !w.tr);
    transBlock.textContent = w.ru;
    transBlock.classList.add("hidden");
    badgeEl.textContent = typeIcon(w.t);

    // SRS-инфо
    if (w.due === null) {
        infoEl.textContent = "🆕 Новая карточка";
        infoEl.className = "srs-info new";
    } else {
        const diff = w.due - Date.now();
        const intLabel = " · интервал: " + formatInterval((w.interval || 0) * DAY_MS);
        if (diff < 0) {
            infoEl.textContent = "⚠️ Просрочено на " + formatInterval(-diff) + intLabel;
            infoEl.className = "srs-info overdue";
        } else {
            infoEl.textContent = "⏰ К повторению" + intLabel;
            infoEl.className = "srs-info overdue";
        }
    }

    renderSRSButtons(w);
    updateStats();
}

function showTranslation() {
    document.getElementById("translation").classList.remove("hidden");
}

// ---------- Статистика и список ----------
function updateStats() {
    const now = Date.now();
    const dueCount = words.filter(w => w.due === null || w.due <= now).length;
    const learnedCount = words.filter(isLearned).length;
    document.getElementById("total").textContent = words.length;
    document.getElementById("dueCount").textContent = dueCount;
    document.getElementById("learned").textContent = learnedCount;
    showWordList();
}

function showWordList() {
    const list = document.getElementById("wordList");
    list.innerHTML = "";
    words.forEach((w, index) => {
        const item = document.createElement("div");
        item.className = "wl-item";

        let srsLabel;
        if (w.due === null && (w.reps || 0) === 0) {
            srsLabel = "🆕";
        } else if ((w.interval || 0) >= 1) {
            srsLabel = "✅ " + w.interval + "д";
        } else {
            srsLabel = "⏳ обучение";
        }

        const p = document.createElement("p");
        p.textContent = typeIcon(w.t).split(" ")[0] + " " + w.en + " — " + w.ru +
            (w.tr ? " " + w.tr : "") + " · " + srsLabel;
        item.appendChild(p);

        const edit = document.createElement("button");
        edit.textContent = "✎";
        edit.className = "light";
        edit.onclick = function () {
            const t = prompt("Транскрипция для \"" + w.en + "\":", w.tr || "");
            if (t !== null) {
                w.tr = t.trim();
                save();
                showCard();
            }
        };
        item.appendChild(edit);

        const del = document.createElement("button");
        del.textContent = "Удалить";
        del.className = "red";
        del.onclick = function () {
            const wasCurrent = (currentCard === w);
            words.splice(index, 1);
            if (wasCurrent) currentCard = null;
            save();
            showCard();
        };
        item.appendChild(del);

        list.appendChild(item);
    });
}

// ---------- Тест (10 вопросов) ----------
const QUIZ_LENGTH = 10;
let quizQueue = [];
let quizTotal = 0;
let quizAnswered = 0;
let quizScore = 0;

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz() {
    if (words.length < 4) {
        document.getElementById("question").textContent = "Нажми кнопку, чтобы начать тест.";
        document.getElementById("message").textContent = "Для теста нужно минимум 4 карточки.";
        return;
    }
    quizQueue = shuffle(words.slice()).slice(0, QUIZ_LENGTH);
    quizTotal = quizQueue.length;
    quizAnswered = 0;
    quizScore = 0;
    nextQuestion();
}

function nextQuestion() {
    if (words.length < 4 || !quizQueue.length) { showQuizResult(); return; }

    const correct = quizQueue.shift();
    quizAnswered++;

    const options = [correct];
    const usedRu = new Set([correct.ru]);
    let guard = 0;
    while (options.length < 4 && guard < 200) {
        guard++;
        const random = words[Math.floor(Math.random() * words.length)];
        if (random && !usedRu.has(random.ru)) {
            options.push(random);
            usedRu.add(random.ru);
        }
    }
    shuffle(options);

    document.getElementById("question").textContent =
        "Вопрос " + quizAnswered + " из " + quizTotal + ". Как переводится: " + correct.en + "?";
    document.getElementById("message").textContent = "";

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    options.forEach(option => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = option.ru;
        button.onclick = function () {
            Array.from(answers.querySelectorAll("button")).forEach(b => b.disabled = true);
            let learnedNow = false;
            if (option === correct) {
                quizScore++;
                correct.correct = (correct.correct || 0) + 1;
                if (correct.correct >= 2) {
                    correct.status = "learned";
                    correct.correct = 0;
                    learnedNow = true;
                }
                const extra = learnedNow ? " 🎉 Слово выучено!" : " (ещё 1 правильный ответ — и выучено)";
                document.getElementById("message").textContent = "✅ Правильно! Молодец!" + extra;
            } else {
                correct.correct = 0;
                correct.status = "review";
                document.getElementById("message").textContent =
                    "❌ Неправильно. Верный ответ: " + correct.ru;
            }
            save();
            updateStats();
            const delay = learnedNow ? 1800 : (option === correct ? 1100 : 1500);
            setTimeout(() => {
                if (quizQueue.length) nextQuestion();
                else showQuizResult();
            }, delay);
        };
        answers.appendChild(button);
    });
}

function showQuizResult() {
    const total = quizTotal;
    const percent = total ? Math.round(quizScore / total * 100) : 0;
    let comment;
    if (percent >= 90) comment = "🏆 Отлично! Ты знаешь эти слова наизусть!";
    else if (percent >= 70) comment = "👍 Хороший результат! Ещё немного практики.";
    else if (percent >= 50) comment = "🙂 Неплохо, но стоит повторить материал.";
    else comment = "📚 Пока сложновато — повтори слова и попробуй снова.";

    document.getElementById("question").textContent = "🏁 Тест завершён!";
    document.getElementById("message").textContent = "";

    const answers = document.getElementById("answers");
    answers.innerHTML = "";

    const result = document.createElement("div");
    result.className = "result-box";
    result.innerHTML =
        '<p style="font-size:22px;font-weight:bold;color:#5146d8;margin:6px 0">' +
        "Результат: " + quizScore + " из " + total + " (" + percent + "%)</p>" +
        '<p style="margin:8px 0">' + comment + "</p>";
    answers.appendChild(result);

    const again = document.createElement("button");
    again.textContent = "🔄 Пройти ещё раз";
    again.onclick = startQuiz;
    answers.appendChild(again);

    quizQueue = [];
}

// ---------- Добавление слова ----------
function addWord() {
    const en = document.getElementById("english").value.trim();
    const ru = document.getElementById("russian").value.trim();
    const trManual = document.getElementById("transc").value.trim();
    const msgEl = document.getElementById("addMessage");

    if (!en || !ru) { msgEl.textContent = "Заполни оба поля!"; return; }

    const dup = words.find(w => (w.en || "").toLowerCase() === en.toLowerCase());
    if (dup) { msgEl.textContent = "Такое слово уже есть в списке!"; return; }

    const word = {
        en: en, ru: ru, tr: trManual,
        t: /[.!?]\s*$/.test(en) ? "s" : (en.includes(" ") ? "p" : "w"),
        status: "new",
        due: null, interval: 0, ease: 2.5,
        reps: 0, lapses: 0, stepIndex: 0
    };
    words.push(word);
    save();
    document.getElementById("english").value = "";
    document.getElementById("russian").value = "";
    document.getElementById("transc").value = "";
    updateStats();

    if (trManual) {
        msgEl.textContent = "✅ Карточка добавлена! Транскрипция: " + trManual;
        return;
    }

    msgEl.textContent = "✅ Карточка добавлена! Ищу транскрипцию…";
    fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(en))
        .then(r => (r.ok ? r.json() : Promise.reject("not found")))
        .then(data => {
            const entry = data && data[0];
            let tr = (entry && entry.phonetic) || "";
            if (!tr && entry && Array.isArray(entry.phonetics)) {
                const p = entry.phonetics.find(x => x.text);
                tr = p ? p.text : "";
            }
            if (tr) {
                word.tr = tr;
                save();
                updateStats();
                msgEl.textContent = "✅ Карточка добавлена! Транскрипция: " + tr;
            } else {
                msgEl.textContent = "✅ Карточка добавлена. Транскрипцию не нашёл — вписать можно вручную (✎ в списке).";
            }
        })
        .catch(() => {
            msgEl.textContent = "✅ Карточка добавлена. Транскрипцию не нашёл — вписать можно вручную (✎ в списке).";
        });
}

// ---------- Инициализация ----------
document.getElementById("question").textContent = "Нажми кнопку, чтобы начать тест.";
const startBtn = document.createElement("button");
startBtn.textContent = "Начать тест";
startBtn.onclick = startQuiz;
document.getElementById("answers").appendChild(startBtn);

showCard();
</script>
